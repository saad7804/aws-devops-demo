apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxops
  namespace: fluxops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluxops
  template:
    metadata:
      labels:
        app: fluxops
    spec:
      containers:
        - name: fluxops
          image: 888869353635.dkr.ecr.ap-south-1.amazonaws.com/fluxops:v1
          ports:
            - containerPort: 80
